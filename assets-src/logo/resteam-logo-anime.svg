<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="512" height="512" role="img" aria-label="Logo ResTeaM">
<style>
  /* Rapport de vitesse réaliste : 12, 8 et 6 dents → périodes 24 s, 16 s, 12 s */
  @keyframes rt-cw  { to { transform: rotate(360deg); } }
  @keyframes rt-ccw { to { transform: rotate(-360deg); } }
  .rt-gear-big    { transform-origin: 110px 96px;    animation: rt-cw  24s linear infinite; }
  .rt-gear-medium { transform-origin: 139.5px 71.2px; animation: rt-ccw 16s linear infinite; }
  .rt-gear-small  { transform-origin: 137px 114.9px; animation: rt-ccw 12s linear infinite; }
  .rt-moon { animation: rt-glow 6s ease-in-out infinite; }
  @keyframes rt-glow { 0%,100% { filter: drop-shadow(0 0 8px rgba(63,224,138,.35)); } 50% { filter: drop-shadow(0 0 14px rgba(63,224,138,.6)); } }
  @media (prefers-reduced-motion: reduce) { .rt-gear-big, .rt-gear-medium, .rt-gear-small, .rt-moon { animation: none; } }
</style>
<defs>
  <mask id="rt-moon-mask"><rect width="200" height="200" fill="#000"/><circle cx="100" cy="100" r="80" fill="#fff"/><circle cx="118" cy="84" r="64" fill="#000"/></mask>
  <linearGradient id="rt-moon-grad" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#1E9E58"/><stop offset=".55" stop-color="#3FE08A"/><stop offset="1" stop-color="#A6FFCB"/></linearGradient>
</defs>
<rect x="4" y="4" width="192" height="192" rx="44" fill="#141617"/>
