<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Classements</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#09090A}
a{color:#E6E9F2}
@keyframes m1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(160px,-30px) scale(1.25,.85)}}
@keyframes m2{0%,100%{transform:translate(0,0) scale(1.1)}50%{transform:translate(-200px,20px) scale(.85,1.2)}}
.mk1{animation:m1 30s ease-in-out infinite}.mk2{animation:m2 38s ease-in-out infinite}
@keyframes live{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(238,242,255,.6)}50%{opacity:.6;box-shadow:0 0 0 6px rgba(238,242,255,0)}}
.live{animation:live 2s ease-in-out infinite}
@keyframes cA{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes cB{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.kA{animation:cA .45s ease both}.kB{animation:cB .45s ease both}
.line{transition:background .2s ease}.line:hover{background:rgba(238,242,255,.05)}
</style>
</helmet>
<div style="position: relative; min-height: 1300px; background: #09090A; color: #F2F2F3; font-family: Inter, sans-serif; overflow: hidden">
<div aria-hidden="true" style="position: absolute; left: -10%; right: -10%; top: -160px; height: 480px; filter: blur(60px); pointer-events: none">
<div class="mk1" style="position: absolute; left: 0; top: 60px; width: 60%; height: 260px; border-radius: 50%; background: rgba(46,48,58,.7)"></div>
<div class="mk2" style="position: absolute; right: 0; top: 40px; width: 65%; height: 280px; border-radius: 50%; background: rgba(30,32,40,.85)"></div>
</div>
<nav aria-label="Navigation principale" style="position: absolute; z-index: 3; left: 0; top: 0; bottom: 0; width: 84px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 24px 0; background: linear-gradient(90deg, rgba(9,9,10,.55) 0%, rgba(9,9,10,0) 100%); box-shadow: inset -1px 0 0 rgba(238,242,255,.12), 6px 0 18px -10px rgba(238,242,255,.12)">
<div style="width: 42px; height: 42px; border-radius: 13px; background: rgba(242,242,243,.92); color: #09090A; font-family: 'Space Grotesk'; font-weight: 700; font-size: 19px; display: flex; align-items: center; justify-content: center; margin-bottom: 22px">R</div>
<button aria-label="Bibliothèque" style="width: 52px; height: 52px; border-radius: 16px; border: none; background: transparent; color: #8E8E94; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg></button>
<button aria-label="Magasin" style="width: 52px; height: 52px; border-radius: 16px; border: none; background: transparent; color: #8E8E94; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9l1.5-5h15L21 9"></path><path d="M4 9v11h16V9"></path><path d="M9 20v-6h6v6"></path></svg></button>
<button aria-label="Classements" style="position: relative; width: 52px; height: 52px; border-radius: 16px; border: none; background: rgba(255,255,255,.08); color: #F2F2F3; display: flex; align-items: center; justify-content: center"><span aria-hidden="true" style="position: absolute; left: -16px; top: 14px; width: 4px; height: 24px; border-radius: 0 4px 4px 0; background: #EEF2FF"></span><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"></path></svg></button>
<button aria-label="Liste de souhaits" style="width: 52px; height: 52px; border-radius: 16px; border: none; background: transparent; color: #8E8E94; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"></path></svg></button>
</nav>
<main style="position: relative; z-index: 1; padding: 40px 64px 72px 140px; display: flex; flex-direction: column; gap: 32px">
<header style="display: flex; align-items: flex-end; gap: 24px; flex-wrap: wrap">
<h1 style="margin: 0; font-family: 'Space Grotesk'; font-size: 64px; line-height: 1; font-weight: 700; letter-spacing: -2px">Classements</h1>
<div style="flex: 1"></div>
<div style="display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: rgba(18,18,20,.6); border: 1px solid rgba(238,242,255,.1)">
<sc-for list="{{ tabs }}" as="t" hint-placeholder-count="2">
<button onClick="{{ t.pick }}" aria-pressed="{{t.on}}" style="height: 38px; padding: 0 18px; border-radius: 999px; border: none; background: {{t.bg}}; color: {{t.color}}; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">{{t.label}}</button>
</sc-for>
</div>
</header>

<section aria-label="Joueurs en ligne" style="display: flex; align-items: center; gap: 40px; flex-wrap: wrap; padding: 26px 30px; border-radius: 26px; background: rgba(18,18,20,.6); border: 1px solid rgba(238,242,255,.1)">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: #CFCFD4"><span class="live" style="width: 8px; height: 8px; border-radius: 50%; background: #EEF2FF"></span>En ligne maintenant</span>
<span style="font-family: 'Space Grotesk'; font-size: 56px; font-weight: 700; letter-spacing: -2px; line-height: 1">41 409 320</span>
<span style="font-size: 14px; color: #A3A3A8">Pic du jour : 42 306 574</span>
</div>
<div aria-hidden="true" style="flex: 1; min-width: 360px; height: 110px; display: flex; align-items: flex-end; gap: 3px">
<sc-for list="{{ bars }}" as="b" hint-placeholder-count="48">
<span style="flex: 1; height: {{b.h}}; border-radius: 3px 3px 0 0; background: {{b.c}}"></span>
</sc-for>
</div>
</section>

<sc-for list="{{ boardKey }}" as="bk" hint-placeholder-count="1">
<section class="{{bk.cls}}" aria-label="{{board.title}}" style="display: flex; gap: 22px; flex-wrap: wrap; align-items: stretch">
<article style="flex: 1 1 460px; position: relative; min-height: 420px; border-radius: 28px; overflow: hidden; background: {{board.top.art}}; border: 1px solid rgba(238,242,255,.12); box-shadow: 0 30px 70px rgba(0,0,0,.7); display: flex; flex-direction: column; justify-content: flex-end; padding: 30px">
<div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(0deg, rgba(9,9,10,.9) 0%, rgba(9,9,10,0) 60%)"></div>
<div style="position: relative; display: flex; align-items: flex-end; gap: 18px">
<span style="font-family: 'Space Grotesk'; font-size: 120px; font-weight: 700; line-height: .8; letter-spacing: -6px; color: rgba(238,242,255,.95); text-shadow: 0 0 30px rgba(238,242,255,.25)">1</span>
<div style="display: flex; flex-direction: column; gap: 6px; padding-bottom: 6px"><span style="font-size: 12px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: #CFCFD4">{{board.topLabel}}</span><span style="font-family: 'Space Grotesk'; font-size: 40px; font-weight: 700; letter-spacing: -1px; line-height: 1">{{board.top.title}}</span><span style="font-size: 15px; color: #C9C9CE">{{board.top.val}}</span></div>
</div>
</article>
<div style="flex: 1 1 460px; display: flex; flex-direction: column; border-radius: 28px; background: rgba(18,18,20,.6); border: 1px solid rgba(238,242,255,.08); padding: 10px; box-sizing: border-box">
<sc-for list="{{ board.rest }}" as="r" hint-placeholder-count="9">
<div class="line" style="display: flex; align-items: center; gap: 16px; padding: 12px 14px; border-radius: 16px">
<span style="width: 26px; font-family: 'Space Grotesk'; font-size: 18px; font-weight: 700; color: #8E8E94; text-align: right">{{r.n}}</span>
<span style="width: 64px; aspect-ratio: 16/9; border-radius: 8px; background: {{r.art}}"></span>
<span style="flex: 1; font-size: 15px; font-weight: 600">{{r.title}}</span>
<span style="font-size: 14px; color: #C9C9CE">{{r.val}}</span>
</div>
</sc-for>
<a href="#" style="margin: 8px 14px 6px; font-size: 14px; font-weight: 600; text-decoration: none; color: #CFCFD4">Voir le top 100 →</a>
</div>
</section>
</sc-for>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1300}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { tab: 'sales', flip: false }; }
hue(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360; return h; }
renderVals() {
const art = (t) => { const h = this.hue(t); return 'linear-gradient(150deg, hsl(' + h + ',40%,32%) 0%, hsl(' + h + ',30%,14%) 70%, #101012 100%)'; };
const sales = ['AION 2', 'Call of Duty: Modern Warfare 4', 'Football Manager 27', 'Moon Sweepers', 'Queen’s Domain'];
const played = [['Counter-Strike 2', '1 265 020'], ['Dota 2', '829 390'], ['PUBG: BATTLEGROUNDS', '746 790'], ['Phantom Blade Zero', '503 848'], ['Apex Legends', '235 350']];
const isSales = this.state.tab === 'sales';
const rows = isSales ? sales.map((t) => [t, '']) : played.map((p) => [p[0], p[1] + ' en jeu']);
const board = {
title: isSales ? 'Meilleures ventes' : 'Les plus joués',
topLabel: isSales ? 'Meilleure vente du moment' : 'Le plus joué en ce moment',
top: { title: rows[0][0], val: isSales ? 'N°1 des ventes' : rows[0][1], art: art(rows[0][0]) },
rest: rows.slice(1).map((r, i) => ({ n: i + 2, title: r[0], val: r[1], art: art(r[0]) }))
};
const bars = [];
for (let i = 0; i < 48; i++) {
const v = 0.62 + 0.22 * Math.sin(i / 48 * Math.PI * 2 - 1.2) + 0.08 * Math.sin(i / 3.3);
bars.push({ h: Math.round(v * 100) + '%', c: i === 47 ? '#EEF2FF' : 'rgba(238,242,255,' + (0.12 + 0.25 * i / 47).toFixed(2) + ')' });
}
const T = [['sales', 'Meilleures ventes'], ['played', 'Les plus joués']];
return {
board, bars, boardKey: [{ cls: this.state.flip ? 'kB' : 'kA' }],
tabs: T.map((t) => { const on = this.state.tab === t[0]; return { label: t[1], on: on ? 'true' : 'false', bg: on ? '#EEF2FF' : 'transparent', color: on ? '#0A0D14' : '#C9C9CE', pick: () => this.setState({ tab: t[0], flip: !this.state.flip }) }; })
};
}
}
</script>
</body>
</html>
