<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Bibliothèque complète</title>
<script>
/* ResTeaM — mini runtime autonome pour les maquettes .dc.html
   Remplace le runtime du canevas : interprète {{…}}, <sc-for>, <sc-if>, les événements onClick/onMouseEnter/…
   et la classe Component (state / setState / renderVals). Aucune dépendance. */
(function () {
  class DCLogic {
    constructor(props) { this.props = props || {}; this.state = {}; }
    setState(p) {
      const patch = typeof p === 'function' ? p(this.state, this.props) : p;
      this.state = Object.assign({}, this.state, patch);
      this.__schedule && this.__schedule();
    }
    forceUpdate() { this.__schedule && this.__schedule(); }
  }
  window.DCLogic = DCLogic;

  const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  const ONLY = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;
  const EVENTS = { onclick: 'click', onmouseenter: 'mouseenter', onmouseleave: 'mouseleave', oninput: 'input', onchange: 'change', onmousemove: 'mousemove', onkeydown: 'keydown' };

  function lookup(path, scope) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (path === 'null') return null;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    if (/^'.*'$|^".*"$/.test(path)) return path.slice(1, -1);
    let v = scope;
    for (const k of path.split('.')) { if (v == null) return undefined; v = v[k]; }
    return v;
  }
  const str = (v) => (v == null ? '' : String(v));
  const interp = (s, scope) => s.replace(HOLE, (_, p) => str(lookup(p, scope)));

  function build(node, scope, out) {
    if (node.nodeType === 3) { out.push(document.createTextNode(interp(node.nodeValue, scope))); return; }
    if (node.nodeType !== 1) return;
    const tag = node.localName;
    if (tag === 'sc-for') {
      const m = (node.getAttribute('list') || '').match(ONLY);
      const list = m ? lookup(m[1], scope) : [];
      const as = node.getAttribute('as') || 'item';
      (list || []).forEach((item, i) => {
        const s = Object.create(scope); s[as] = item; s.$index = i;
        node.childNodes.forEach((c) => build(c, s, out));
      });
      return;
    }
    if (tag === 'sc-if') {
      const m = (node.getAttribute('value') || '').match(ONLY);
      if (m && lookup(m[1], scope)) node.childNodes.forEach((c) => build(c, scope, out));
      return;
    }
    if (tag === 'dc-import' || tag === 'helmet') return;
    const el = node.cloneNode(false);
    el.__h = {};
    for (const a of Array.from(node.attributes)) {
      const name = a.name;
      if (name.startsWith('hint-')) { el.removeAttribute(name); continue; }
      if (EVENTS[name]) {
        el.removeAttribute(name);
        const m = a.value.match(ONLY);
        const fn = m ? lookup(m[1], scope) : null;
        if (typeof fn === 'function') el.__h[EVENTS[name]] = fn;
        continue;
      }
      if (a.value.indexOf('{{') !== -1) {
        const m = a.value.match(ONLY);
        const v = m ? lookup(m[1], scope) : interp(a.value, scope);
        if (v === false || v == null) el.removeAttribute(name); else el.setAttribute(name, str(v));
      }
    }
    const kids = [];
    const src = node.localName === 'template' ? node.content : node;
    src.childNodes.forEach((c) => build(c, scope, kids));
    kids.forEach((k) => el.appendChild(k));
    out.push(el);
  }

  function bind(el) {
    if (el.nodeType !== 1 || el.__bound) return;
    el.__bound = true;
    ['click', 'mouseenter', 'mouseleave', 'input', 'change', 'mousemove', 'keydown'].forEach((t) => {
      el.addEventListener(t, (e) => { const f = el.__h && el.__h[t]; if (f) f(e); });
    });
  }
  function bindAll(el) { if (el.nodeType !== 1) return; bind(el); el.querySelectorAll('*').forEach(bind); }

  function morph(a, b) {
    if (a.nodeType !== b.nodeType || (a.nodeType === 1 && a.namespaceURI + a.localName !== b.namespaceURI + b.localName)) {
      bindAll(b); a.replaceWith(b); return;
    }
    if (a.nodeType === 3) { if (a.nodeValue !== b.nodeValue) a.nodeValue = b.nodeValue; return; }
    if (a.nodeType !== 1) return;
    for (const at of Array.from(a.attributes)) if (!b.hasAttribute(at.name)) a.removeAttribute(at.name);
    for (const at of Array.from(b.attributes)) if (a.getAttribute(at.name) !== at.value) a.setAttribute(at.name, at.value);
    a.__h = b.__h;
    if (a.localName === 'input' && document.activeElement !== a && b.hasAttribute('value')) a.value = b.getAttribute('value');
    morphChildren(a, b);
  }
  function morphChildren(a, b) {
    const ak = Array.from(a.childNodes), bk = Array.from(b.childNodes);
    for (let i = 0; i < bk.length; i++) {
      if (i < ak.length) morph(ak[i], bk[i]); else { bindAll(bk[i]); a.appendChild(bk[i]); }
    }
    for (let i = bk.length; i < ak.length; i++) ak[i].remove();
  }

  function boot() {
    const host = document.querySelector('x-dc');
    if (!host) return;
    const tpl = document.createElement('template');
    tpl.innerHTML = host.innerHTML;
    host.innerHTML = '';
    host.style.display = 'block';
    const helmet = tpl.content.querySelector('helmet');
    if (helmet) { Array.from(helmet.childNodes).forEach((n) => document.head.appendChild(n.cloneNode(true))); helmet.remove(); }
    const script = document.querySelector('script[data-dc-script]');
    let props = {};
    try {
      const defs = JSON.parse(script.getAttribute('data-props') || '{}');
      Object.keys(defs).forEach((k) => { if (k[0] !== '$' && defs[k] && 'default' in defs[k]) props[k] = defs[k].default; });
    } catch (e) { console.warn('data-props', e); }
    const Component = new Function('DCLogic', script.textContent + '\nreturn Component;')(DCLogic);
    const comp = new Component(props);
    let queued = false;
    const render = () => {
      queued = false;
      const out = [];
      const vals = comp.renderVals();
      tpl.content.childNodes.forEach((c) => build(c, vals, out));
      const next = document.createElement('div');
      out.forEach((n) => next.appendChild(n));
      if (!host.__first) {
        host.__first = true;
        Array.from(next.childNodes).forEach((n) => { bindAll(n); host.appendChild(n); });
      } else {
        morphChildren(host, next);
      }
    };
    comp.__schedule = () => { if (!queued) { queued = true; requestAnimationFrame(render); } };
    render();
    if (comp.componentDidMount) comp.componentDidMount();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#09090A}
a{color:#E6E9F2}
@keyframes m1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(160px,-30px) scale(1.25,.85)}}
@keyframes m2{0%,100%{transform:translate(0,0) scale(1.1)}50%{transform:translate(-200px,20px) scale(.85,1.2)}}
.mk1{animation:m1 30s ease-in-out infinite}.mk2{animation:m2 38s ease-in-out infinite}
@keyframes popA{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
@keyframes popB{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.gA{animation:popA .45s cubic-bezier(.2,.8,.2,1) both}.gB{animation:popB .45s cubic-bezier(.2,.8,.2,1) both}
.tile{transition:transform .25s ease, border-color .25s ease, box-shadow .25s ease}
.tile:hover{transform:translateY(-5px)}
</style>
</helmet>
<div style="position: relative; min-height: 1400px; background: #09090A; color: #F2F2F3; font-family: Inter, sans-serif; overflow: hidden">

<div aria-hidden="true" style="position: absolute; left: -10%; right: -10%; top: -160px; height: 480px; filter: blur(60px); pointer-events: none">
<div class="mk1" style="position: absolute; left: 0; top: 60px; width: 60%; height: 260px; border-radius: 50%; background: rgba(46,48,58,.7)"></div>
<div class="mk2" style="position: absolute; right: 0; top: 40px; width: 65%; height: 280px; border-radius: 50%; background: rgba(30,32,40,.85)"></div>
</div>

<nav aria-label="Navigation principale" style="position: absolute; z-index: 3; left: 0; top: 0; bottom: 0; width: 84px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 24px 0; background: linear-gradient(90deg, rgba(9,9,10,.55) 0%, rgba(9,9,10,0) 100%); box-shadow: inset -1px 0 0 rgba(238,242,255,.12), 6px 0 18px -10px rgba(238,242,255,.12)">
<div style="width: 42px; height: 42px; border-radius: 13px; background: rgba(242,242,243,.92); color: #09090A; font-family: 'Space Grotesk', 'Inter Display', Inter, sans-serif, 'Inter Display', Inter, sans-serif; font-weight: 700; font-size: 19px; display: flex; align-items: center; justify-content: center; margin-bottom: 22px">R</div>
<button aria-label="Bibliothèque" style="position: relative; width: 52px; height: 52px; border-radius: 16px; border: none; background: rgba(255,255,255,.08); color: #F2F2F3; display: flex; align-items: center; justify-content: center"><span aria-hidden="true" style="position: absolute; left: -16px; top: 14px; width: 4px; height: 24px; border-radius: 0 4px 4px 0; background: #EEF2FF"></span><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg></button>
<button aria-label="Magasin" style="width: 52px; height: 52px; border-radius: 16px; border: none; background: transparent; color: #8E8E94; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9l1.5-5h15L21 9"></path><path d="M4 9v11h16V9"></path><path d="M9 20v-6h6v6"></path></svg></button>
<button aria-label="Classements" style="width: 52px; height: 52px; border-radius: 16px; border: none; background: transparent; color: #8E8E94; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"></path></svg></button>
<button aria-label="Liste de souhaits" style="width: 52px; height: 52px; border-radius: 16px; border: none; background: transparent; color: #8E8E94; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"></path></svg></button>
</nav>

<main style="position: relative; z-index: 1; padding: 40px 64px 72px 140px; display: flex; flex-direction: column; gap: 28px">
<header style="display: flex; align-items: flex-end; gap: 24px; flex-wrap: wrap">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: 'Space Grotesk', 'Inter Display', Inter, sans-serif, 'Inter Display', Inter, sans-serif; font-size: 64px; line-height: 1; font-weight: 700; letter-spacing: -2px">Bibliothèque</h1>
<span style="font-size: 15px; color: #A3A3A8">{{countText}}</span>
</div>
<div style="flex: 1"></div>
<label style="display: flex; align-items: center; gap: 10px; width: 360px; height: 48px; padding: 0 16px; border-radius: 16px; background: rgba(18,18,20,.6); border: 1px solid rgba(238,242,255,.12); backdrop-filter: blur(14px); color: #A3A3A8; box-sizing: border-box"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg><span style="position: absolute; left: -9999px">Rechercher un jeu</span><input value="{{query}}" onInput="{{ typeQ }}" placeholder="Rechercher dans tes 130 jeux" style="flex: 1; background: none; border: none; color: #F2F2F3; font: inherit; font-size: 15px; outline: none"></label>
</header>

<div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap">
<sc-for list="{{ filters }}" as="f" hint-placeholder-count="5">
<button onClick="{{ f.pick }}" aria-pressed="{{f.on}}" style="height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid {{f.line}}; background: {{f.bg}}; color: {{f.color}}; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px">{{f.label}}<span style="font-size: 12px; opacity: .65">{{f.n}}</span></button>
</sc-for>
<div style="flex: 1"></div>
<span style="font-size: 13px; color: #8E8E94">Trier</span>
<div style="display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: rgba(18,18,20,.6); border: 1px solid rgba(238,242,255,.1)">
<sc-for list="{{ sorts }}" as="s" hint-placeholder-count="2">
<button onClick="{{ s.pick }}" aria-pressed="{{s.on}}" style="height: 32px; padding: 0 14px; border-radius: 999px; border: none; background: {{s.bg}}; color: {{s.color}}; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">{{s.label}}</button>
</sc-for>
</div>
</div>

<sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
<div style="padding: 80px 0; text-align: center; color: #8E8E94">Aucun jeu ne correspond à « {{query}} ».</div>
</sc-if>

<sc-for list="{{ gridKey }}" as="gk" hint-placeholder-count="1">
<div class="{{gk.cls}}" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 22px 18px">
<sc-for list="{{ games }}" as="g" hint-placeholder-count="12">
<div class="tile" onMouseEnter="{{ g.enter }}" onMouseLeave="{{ leave }}" style="display: flex; flex-direction: column; gap: 10px">
<div style="position: relative; aspect-ratio: 3/4; border-radius: 18px; background: {{g.art}}; border: 2px solid {{g.border}}; box-shadow: {{g.shadow}}; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; padding: 14px; box-sizing: border-box; gap: 10px">
<sc-if value="{{ g.hasRank }}" hint-placeholder-val="{{ false }}"><span title="{{g.rankTitle}}" style="position: absolute; top: 10px; right: 10px; min-width: 30px; height: 30px; padding: 0 6px; border-radius: 999px; border: 1.5px solid rgba(238,242,255,.7); background: rgba(9,9,10,.6); backdrop-filter: blur(8px); font-family: 'Space Grotesk', 'Inter Display', Inter, sans-serif, 'Inter Display', Inter, sans-serif; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-sizing: border-box">{{g.rank}}</span></sc-if>
<sc-if value="{{ g.fav }}" hint-placeholder-val="{{ false }}"><span aria-label="Favori" style="position: absolute; top: 12px; left: 12px; color: #EEF2FF"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"></path></svg></span></sc-if>
<span style="font-family: 'Space Grotesk', 'Inter Display', Inter, sans-serif, 'Inter Display', Inter, sans-serif; font-weight: 700; font-size: 18px; line-height: 1.1; color: rgba(255,255,255,.92)">{{g.title}}</span>
<sc-if value="{{ g.hover }}" hint-placeholder-val="{{ false }}">
<button style="height: 38px; border-radius: 12px; border: none; background: {{g.btnBg}}; color: {{g.btnColor}}; font: inherit; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer">{{g.action}}</button>
</sc-if>
</div>
<div style="display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: #8E8E94; padding: 0 2px"><span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{g.meta}}</span><span style="display: flex; align-items: center; gap: 6px; white-space: nowrap"><span style="width: 6px; height: 6px; border-radius: 50%; background: {{g.dot}}"></span>{{g.state}}</span></div>
</div>
</sc-for>
</div>
</sc-for>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1400}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { filter: 'all', sort: 'az', q: '', hover: null, flip: false }; }
hue(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360; return h; }
renderVals() {
const raw = [
['A Dance of Fire and Ice', 0, 0, 0], ['Aimlabs', 0, 1, 0], ['AION 2', 0, 1, 0], ['Among Us', 0, 0, 0],
['Apex Legends', 0, 1, 1], ['ARK: Survival Evolved', 0, 0, 0], ['Assetto Corsa', 0, 0, 0], ['Black Myth: Wukong', 0, 0, 0],
['Bloons TD 6', 0, 1, 1], ['Brawlhalla', 0, 0, 1], ['Call of Duty', 0, 1, 0], ['Chained Together', 0, 0, 0],
['Clair Obscur: Expedition 33', 0, 1, 1], ['Core Keeper', 0, 0, 0], ['Counter-Strike 2', 0, 1, 0], ['Cult of the Lamb', 0, 0, 0],
['Cuphead', 0, 0, 0], ['Elden Ring', 0, 1, 1], ['Hades II', 48, 1, 1], ['Hogwarts Legacy', 20, 1, 0],
['Overwatch', 0, 0, 1], ['Satisfactory', 0, 1, 1], ['Slay the Spire 2', 0, 1, 1], ['Undertale', 7.3, 1, 1], ['Wuthering Waves', 0, 0, 1]
];
const recent = ['Undertale', 'Hades II', 'Hogwarts Legacy'];
const T = [10, 50, 100, 250, 500, 1000, 2000, 5000, 10000];
const R = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX'];
const N = ['Éveillé', 'Initié', 'Habitué', 'Vétéran', 'Expert', 'Maître', 'Légende', 'Mythe', 'Éternel'];
let all = raw.map((r) => ({ title: r[0], h: r[1], inst: !!r[2], fav: !!r[3] }));
const q = this.state.q.trim().toLowerCase();
const counts = { all: 130, inst: all.filter((g) => g.inst).length, fav: 14, recent: recent.length, coll: 5 };
let list = all;
if (this.state.filter === 'inst') list = list.filter((g) => g.inst);
if (this.state.filter === 'fav') list = list.filter((g) => g.fav);
if (this.state.filter === 'recent') list = recent.map((t) => all.find((g) => g.title === t));
if (q) list = list.filter((g) => g.title.toLowerCase().indexOf(q) !== -1);
if (this.state.sort === 'az') list = list.slice().sort((a, b) => a.title.localeCompare(b.title));
if (this.state.sort === 'time') list = list.slice().sort((a, b) => b.h - a.h || a.title.localeCompare(b.title));
const games = list.map((g) => {
const hu = this.hue(g.title);
const on = this.state.hover === g.title;
const r = T.filter((x) => g.h >= x).length;
return {
title: g.title, fav: g.fav, hover: on,
art: 'linear-gradient(160deg, hsl(' + hu + ',38%,30%) 0%, hsl(' + hu + ',30%,16%) 55%, #101012 100%)',
border: on ? '#EEF2FF' : 'rgba(238,242,255,.06)',
shadow: on ? '0 22px 44px rgba(0,0,0,.75), 0 0 22px rgba(238,242,255,.14)' : '0 14px 30px rgba(0,0,0,.55)',
hasRank: r > 0, rank: r > 0 ? R[r - 1] : '', rankTitle: r > 0 ? 'Rang ' + R[r - 1] + ' · ' + N[r - 1] : '',
meta: g.h ? String(g.h).replace('.', ',') + ' h' : 'Jamais lancé',
state: g.inst ? 'Installé' : 'Non installé', dot: g.inst ? '#EEF2FF' : 'rgba(255,255,255,.2)',
action: g.inst ? 'Jouer' : 'Installer',
btnBg: g.inst ? '#EEF2FF' : 'rgba(9,9,10,.7)', btnColor: g.inst ? '#0A0D14' : '#F2F2F3',
enter: () => this.setState({ hover: g.title })
};
});
const F = [['all', 'Tous', counts.all], ['inst', 'Installés', counts.inst], ['fav', 'Favoris', counts.fav], ['recent', 'Récents', counts.recent]];
const filters = F.map((f) => {
const on = this.state.filter === f[0];
return { label: f[1], n: f[2], on: on ? 'true' : 'false', bg: on ? '#EEF2FF' : 'rgba(18,18,20,.55)', color: on ? '#0A0D14' : '#D6D6DA', line: on ? '#EEF2FF' : 'rgba(238,242,255,.12)', pick: () => this.setState({ filter: f[0], flip: !this.state.flip }) };
});
const S = [['az', 'A → Z'], ['time', 'Temps de jeu']];
const sorts = S.map((s) => {
const on = this.state.sort === s[0];
return { label: s[1], on: on ? 'true' : 'false', bg: on ? 'rgba(238,242,255,.14)' : 'transparent', color: on ? '#F2F2F3' : '#A3A3A8', pick: () => this.setState({ sort: s[0], flip: !this.state.flip }) };
});
return {
games, filters, sorts, query: this.state.q, empty: games.length === 0,
gridKey: [{ cls: this.state.flip ? 'gB' : 'gA' }],
countText: '130 jeux · ' + counts.inst + ' installés (aperçu de ' + all.length + ' jeux)',
typeQ: (e) => this.setState({ q: e.target.value }),
leave: () => this.setState({ hover: null })
};
}
}
</script>
</body>
</html>
