[package]
name = "resteam"
version = "0.1.0"
description = "ResTeaM — vitrine pour Steam"
authors = ["YIUNO"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "resteam_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-winrt-notification = "0.8"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
tokio = { version = "1.54.1", features = ["net", "io-util", "time", "sync", "macros"] }
thiserror = "2.0.21"
url = "2.5.8"
rand = "0.10.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "http2"] }
keyring = { version = "3", features = ["windows-native"] }
winreg = "0.56.0"
percent-encoding = "2"
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_Security_Cryptography"] }
base64 = "0.22"
sysinfo = { version = "0.40.1", default-features = false, features = ["disk", "network", "system"] }


[dev-dependencies]
# Campagne « tout faire planter » : entrées tirées au hasard (voir src/robustesse.rs).
proptest = "1"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
